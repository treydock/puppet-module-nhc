name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:


jobs:
  unit:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: 3.2
            openvox: 8
            fixtures: .fixtures.yml
            allow_failure: false
          - ruby: 4.0
            openvox: 9
            fixtures: .fixtures.yml
            allow_failure: false
    env:
      BUNDLE_WITHOUT: system_tests:release
      OPENVOX_GEM_VERSION: "~> ${{ matrix.openvox }}.0"
      FIXTURES_YML: ${{ matrix.fixtures }}
    name: OpenVox ${{ matrix.openvox }} (Ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v3
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 3
      - name: Validate
        run: bundle exec rake check:git_ignore check:dot_underscore check:test_file rubocop syntax lint metadata_lint
      - name: Run tests
        run: bundle exec rake parallel_spec
  acceptance:
    # Run on 22.04 until newer doesn't cause ioctl errors for el10 tests
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        set:
          - "el8"
          - "el9"
          - "el10"
          - "debian-12"
          - "ubuntu-2204"
          - "ubuntu-2404"
        openvox:
          - "openvox8"
          - "openvox9"
    env:
      BUNDLE_WITHOUT: release
      BEAKER_debug: true
    name: ${{ matrix.openvox }} ${{ matrix.set }}
    steps:
      - name: Enable IPv6 on docker
        run: |
          echo '{"ipv6":true,"fixed-cidr-v6":"2001:db8:1::/64"}' | sudo tee /etc/docker/daemon.json
          sudo service docker restart
      # https://github.com/actions/virtual-environments/issues/181#issuecomment-610874237
      - name: apparmor
        run: |
            set -x
            sudo apt-get remove mysql-server --purge
            sudo apt-get update
            sudo apt-get install apparmor-profiles
            sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld
      - uses: actions/checkout@v3
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 3
          bundler: '2.4.13'
      - name: Run tests
        run: bundle exec rake beaker
        env:
          BEAKER_PUPPET_COLLECTION: ${{ matrix.openvox }}
          BEAKER_set: ${{ matrix.set }}
